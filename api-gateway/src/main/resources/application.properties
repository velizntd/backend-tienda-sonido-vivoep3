spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.routes[0].id=ms-productos
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-productos
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/productos/**,/api/categorias/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-novedades
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-novedades
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/novedades/**

spring.cloud.gateway.server.webflux.routes[2].id=ms-contacto
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-contacto
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/contactos/**

spring.cloud.gateway.server.webflux.routes[3].id=ms-carrito
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-carrito
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/carrito/**,/api/pedidos/**

spring.cloud.gateway.server.webflux.routes[4].id=ms-usuarios
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ms-usuarios
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webflux.routes[5].id=ms-registro
spring.cloud.gateway.server.webflux.routes[5].uri=lb://ms-registro
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[6].id=ms-blogs
spring.cloud.gateway.server.webflux.routes[6].uri=lb://ms-blogs
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/blogs/**

app.jwt.secret=${JWT_SECRET}
