spring.application.name=ms-carrito
server.port=8084

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo
spring.datasource.username=sonidovivo_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_carrito
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT
app.jwt.secret=${JWT_SECRET}

# Consulta de productos mediante Gateway
app.productos.url=${PRODUCTOS_URL:http://localhost:8080}

# Comunicacion interna con ms-productos
app.productos.internal-url=${PRODUCTOS_INTERNAL_URL:http://localhost:8081}
app.internal-service-key=${INTERNAL_SERVICE_KEY:}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html